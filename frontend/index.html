<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SESI LifeTech - Smart Sports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SMART SPORTS & PERFORMANCE</h1>
            <h2>Atleta: <span id="atleta-id">ATLETA_07</span></h2>
        </header>

        <section class="cards">
            <div class="card">
                <h3>Distância</h3>
                <p class="valor"><span id="distancia">0.0</span> <small>km</small></p>
            </div>
            <div class="card">
                <h3>Velocidade</h3>
                <p class="valor"><span id="velocidade">0.0</span> <small>km/h</small></p>
            </div>
            <div class="card">
                <h3>Saltos</h3>
                <p class="valor" id="saltos">0</p>
            </div>
            <div class="card">
                <h3>Mudanças de Direção</h3>
                <p class="valor" id="mudancas">0</p>
            </div>
            <div class="card">
                <h3>Zona de Esforço</h3>
                <p class="valor destaque" id="zona">--</p>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
